services:
  inference:
    build:
      context: ./services/inference
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      INFERENCE_API_URL: http://inference:8000
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
